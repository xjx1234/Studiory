apiVersion: apps/v1
kind: Deployment
metadata:
  name: studiory-api
  labels:
    app: studiory-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: studiory-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: studiory-api
    spec:
      containers:
        - name: api
          # 替换为实际镜像仓库，例如 registry.example.com/studiory-api:v1.0.0
          image: studiory-api:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENV
              value: production
            - name: SERVER_ADDR
              value: ":8080"
          envFrom:
            - secretRef:
                name: studiory-api-secret
          # 存活探针：进程可响应即可；不访问 PG/Redis，避免依赖故障导致误重启
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          # 就绪探针：PG + Redis 均可用才接流量
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
