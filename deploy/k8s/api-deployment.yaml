apiVersion: apps/v1
kind: Deployment
metadata:
  name: studiory-api
  labels:
    app: studiory-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: studiory-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: studiory-api
      annotations:
        # 供未使用 Prometheus Operator 的经典 Prometheus（kubernetes_sd_configs）直接发现抓取；
        # 使用 Prometheus Operator 的话改用 service-monitor.yaml，两者不必同时启用。
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # 同一 app 的多个副本尽量分散到不同节点，避免单节点故障时全部实例同时不可用。
      # 用 preferred（软约束）而非 required，避免小集群节点数不足时 Pod 无法调度。
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: studiory-api
                topologyKey: kubernetes.io/hostname
      # preStop（5s）+ 应用内优雅关闭（main.go 里 shutdown ctx 10s）+ 余量，
      # 需要 terminationGracePeriodSeconds 覆盖两者之和，否则会被强杀（SIGKILL）。
      terminationGracePeriodSeconds: 20
      containers:
        - name: api
          # 替换为实际镜像仓库，例如 registry.example.com/studiory-api:v1.0.0
          image: studiory-api:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENV
              value: production
            - name: SERVER_ADDR
              value: ":8080"
          envFrom:
            - secretRef:
                name: studiory-api-secret
          # 存活探针：进程可响应即可；不访问 PG/Redis，避免依赖故障导致误重启
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          # 就绪探针：PG + Redis 均可用才接流量
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          lifecycle:
            preStop:
              # 收到 SIGTERM 前先 sleep：给 Endpoints/kube-proxy/Ingress 留出时间
              # 把本 Pod 从负载均衡里摘掉，避免摘流生效前仍有新请求打进来。
              # sleep 结束后 kubelet 才发送 SIGTERM，触发 main.go 里的优雅关闭。
              exec:
                command: ["sh", "-c", "sleep 5"]
