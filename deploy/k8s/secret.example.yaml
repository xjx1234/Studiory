# 复制为 secret.yaml 后填入真实值，勿提交到 git
# kubectl apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: studiory-api-secret
type: Opaque
stringData:
  DATABASE_URL: "postgres://user:pass@postgres:5432/app?sslmode=require"
  REDIS_URL: "redis://redis:6379/0"
  JWT_SECRET: "replace-with-strong-random-secret"

  # /metrics 的 Bearer token。ConfigMap 里 METRICS_ENABLED=true，生产启动校验要求
  # 该值非空（缺失会直接退出）。生成：openssl rand -hex 32
  # Prometheus 抓取时放在 Authorization: Bearer <token>。
  # 示例值等同于公开值：未替换前不要把 /metrics 暴露到公网
  #（示例 Ingress 路由 /，会把 /metrics 一并转发）。
  METRICS_TOKEN: "replace-with-strong-random-token"

  # OAuth：只填 ConfigMap 的 OAUTH_PROVIDERS 里列出的渠道；不需要的渠道请从该列表移除。
  # 生产启动校验会逐个检查每个启用渠道的 client_id/app_id，缺一个都会启动失败。
  OAUTH_WECHAT_APP_ID: "replace-with-wechat-app-id"
  OAUTH_WECHAT_APP_SECRET: "replace-with-wechat-app-secret"
  OAUTH_APPLE_CLIENT_ID: "replace-with-apple-client-id"
  OAUTH_GOOGLE_CLIENT_ID: "replace-with-google-client-id"

  CORS_ALLOW_ORIGINS: "https://your-frontend.example.com"
  AUTH_MOCK_CODE_ENABLED: "false"
  OAUTH_DEV_MODE: "false"
  AUTH_MULTI_DEVICE_ENABLED: "true"
  RATE_LIMIT_PER_MINUTE: "60"
  RATE_LIMIT_USER_PER_MINUTE: "120"
