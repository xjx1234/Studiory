# 复制为 secret.yaml 后填入真实值，勿提交到 git
# kubectl apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: studiory-api-secret
type: Opaque
stringData:
  DATABASE_URL: "postgres://user:pass@postgres:5432/app?sslmode=require"
  REDIS_URL: "redis://redis:6379/0"
  JWT_SECRET: "replace-with-strong-random-secret"
  CORS_ALLOW_ORIGINS: "https://your-frontend.example.com"
  AUTH_MOCK_CODE_ENABLED: "false"
  OAUTH_DEV_MODE: "false"
  AUTH_MULTI_DEVICE_ENABLED: "true"
  RATE_LIMIT_PER_MINUTE: "60"
  RATE_LIMIT_USER_PER_MINUTE: "120"
