# ConfigMap：存放非敏感配置（敏感信息放 Secret）
#
# Deployment 通过 envFrom.secretRef + envFrom.configMapRef 组合加载：
#   - secret.example.yaml → DATABASE_URL / REDIS_URL / JWT_SECRET 等
#   - 本文件               → APP_ENV / LOG_FORMAT / CORS 等
#
# 应用：
#   kubectl apply -f deploy/k8s/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: studiory-api-config
data:
  APP_ENV: "production"
  SERVER_ADDR: ":8080"

  # 日志
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

  # Auth
  AUTH_MULTI_DEVICE_ENABLED: "true"
  # 密码注册必须先通过一次性验证码（证明持有该手机号/邮箱）。生产环境必须为 true：
  # 关掉后任何人都能抢注别人的号码，且 /register 退化成账号存在性查询接口。
  AUTH_REQUIRE_CODE_FOR_PASSWORD_REGISTER: "true"

  # OAuth（生产关闭 dev 模式）
  OAUTH_DEV_MODE: "false"
  OAUTH_PROVIDERS: "wechat,apple,google"

  # 限流
  RATE_LIMIT_PER_MINUTE: "60"
  RATE_LIMIT_USER_PER_MINUTE: "120"

  # 可信反向代理网段（Ingress/nginx 的 Pod 或 Node CIDR）。
  # 留空 = 不信任任何代理：X-Forwarded-For 被忽略，限流按 TCP 对端计数——
  # 集群内所有用户会共用 Ingress 那一个桶，因此经 Ingress 暴露时必须按实际 CNI 网段填写。
  # 反过来说，填 0.0.0.0/0 会让任何人都能伪造 XFF 绕过限流，切勿这么做。
  # SERVER_TRUSTED_PROXIES: "10.244.0.0/16"

  # Metrics
  METRICS_ENABLED: "true"

  # CORS（按实际前端域名修改，敏感度低但非默认值）
  CORS_ALLOW_ORIGINS: "https://your-frontend.example.com"
  CORS_ALLOW_CREDENTIALS: "true"
