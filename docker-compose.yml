services:
  postgres:
    image: postgres:16-alpine
    container_name: app-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: app-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 一次性迁移任务：API 启动前确保数据库 schema 已就绪。
  # 迁移不打入 API 镜像，由独立任务执行（生产可换成 CI/CD 或 K8s Job）。
  migrate:
    image: migrate/migrate:v4.17.0
    container_name: app-migrate
    profiles: ["full"]
    volumes:
      - ./backend/migrations:/migrations:ro
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://postgres:password@postgres:5432/app?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: studiory-api:local
    container_name: app-api
    profiles: ["full"]
    environment:
      # 本地一键起栈默认使用 development：启用 mock 验证码、OAuth dev、CORS 默认值，开箱即用。
      # 生产部署请改为 production 并通过环境变量注入安全的 JWT_SECRET、CORS_ALLOW_ORIGINS 等。
      APP_ENV: development
      SERVER_ADDR: ":8080"
      DATABASE_URL: postgres://postgres:password@postgres:5432/app?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-change-in-production
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: app
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate-mysql:
    image: migrate/migrate:v4.17.0
    profiles: ["mysql"]
    volumes:
      - ./backend/migrations/mysql:/migrations:ro
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "mysql://root:password@tcp(mysql:3306)/app?multiStatements=true"
      - "up"
    depends_on:
      mysql:
        condition: service_healthy

  api-mysql:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: studiory-api:mysql-local
    profiles: ["mysql"]
    environment:
      APP_ENV: development
      DB_DRIVER: mysql
      SERVER_ADDR: ":8080"
      DATABASE_URL: root:password@tcp(mysql:3306)/app?parseTime=true&loc=UTC
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-change-in-production
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate-mysql:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  mysql_data:
