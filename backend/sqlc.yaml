version: "2"

sql:
  - engine: "postgresql"
    schema:
      - "migrations/000001_init_schema.up.sql"
      - "migrations/000002_example_todos.up.sql"
    queries:
      - "internal/repo/sqlc/query"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/repo/sqlc/gen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_result_struct_pointers: true
        emit_params_struct_pointers: true
