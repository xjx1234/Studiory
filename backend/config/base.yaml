# ─────────────────────────────────────────────────────────────────────────────
# API 脚手架 - 基础配置（所有环境共用的默认值）
# 加载顺序：base.yaml → {env}.yaml → local.yaml → 环境变量
# ─────────────────────────────────────────────────────────────────────────────

app:
  env: development           # 由具体环境配置文件覆盖
  server_addr: ":8080"
  read_header_timeout: 5s    # 读取请求头超时（防 Slowloris）
  read_timeout: 15s          # 读取完整请求（含 body）
  write_timeout: 30s         # 写入响应超时
  idle_timeout: 120s         # keep-alive 空闲连接超时

database:
  url: ""                    # 非空则优先使用，忽略以下分项
  host: localhost
  port: 5432
  user: postgres
  password: ""
  name: app
  ssl_mode: disable          # disable | require | verify-full
  pool:
    max_conns: 20
    min_conns: 2
    max_conn_idle: 10m       # Go duration 格式
    max_conn_life: 1h

redis:
  url: ""                    # 非空则优先使用，忽略以下分项
  host: localhost
  port: 6379
  password: ""
  db: 0
  pool_size: 10
  key_prefix: app

jwt:
  secret: "dev-secret-change-in-production"
  access_ttl: 2h
  refresh_ttl: 168h          # 7天

auth:
  mock_code_enabled: true     # 仅开发环境使用固定验证码 123456
  multi_device_enabled: true  # true=多设备同时在线；false=单设备（新登录踢掉旧会话）
  redis_fail_open: true       # Redis故障时鉴权策略：true=放行（可用性优先）；false=拒绝（安全性优先）

# 验证码下发（SMTP 邮件，可选）。host 为空则不启用，回退到 mock。
# 短信运营商在 internal/app/app.go 的 buildCodeSender 中按需接入。
smtp:
  host: ""
  port: 587
  username: ""
  password: ""
  from: "no-reply@example.com"

oauth:
  dev_mode: true              # 开发模式：直接用 provider + open_id 登录（不校验第三方 token）
  providers:
    - wechat
    - apple
    - google
  wechat:
    app_id: ""                # 微信移动应用 AppID（生产校验 userinfo 时使用）
    app_secret: ""            # 预留：code 换 token 流程（当前骨架走 access_token+open_id）
  apple:
    client_id: ""             # Sign in with Apple 的 Services ID / Bundle ID
  google:
    client_id: ""             # Google OAuth Client ID（校验 id_token 的 aud）

log:
  level: info                # debug | info | warn | error
  format: console            # console | json

rate_limit:
  per_minute: 120              # 未登录/公开路由：按客户端 IP
  user_per_minute: 120         # 已鉴权 /user、/admin：按 user_id（同 NAT 互不干扰）

metrics:
  enabled: true              # 暴露 Prometheus /metrics 端点（生产可按需关闭或用网络层保护）

cors:
  allow_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
  allow_credentials: true
