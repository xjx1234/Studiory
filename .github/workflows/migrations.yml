name: Migrations

# 只在迁移相关文件变化时触发，避免与主 CI 重复消耗。
on:
  push:
    paths:
      - 'backend/migrations/**'
      # 归一化规则与黄金样例表：改 Go 侧或样例表同样必须重跑 SQL 侧一致性断言
      - 'backend/pkg/strutil/**'
      - 'scripts/check_phone_collisions.sql'
      - 'scripts/check_email_collisions.sql'
      - 'scripts/check_migrations_immutable.sh'
      - 'scripts/migration_upgrade_test.sh'
      - '.github/workflows/migrations.yml'
  pull_request:
    paths:
      - 'backend/migrations/**'
      - 'backend/pkg/strutil/**'
      - 'scripts/check_phone_collisions.sql'
      - 'scripts/check_email_collisions.sql'
      - 'scripts/check_migrations_immutable.sh'
      - 'scripts/migration_upgrade_test.sh'
      - '.github/workflows/migrations.yml'

jobs:
  # 已发布的迁移文件不可修改：基线之后只允许新增版本文件。
  immutable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 闸门要读 migrations-baseline-* tag，必须完整历史 + tag
          fetch-depth: 0

      - name: Check migrations are append-only
        run: bash scripts/check_migrations_immutable.sh

  # 存量库升级路径：基线库 + 脏数据 → up 到 HEAD，验证清洗生效且可重复执行。
  upgrade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 需要用 git archive 取基线 tag 的迁移目录
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # 只作引导；精确钉扎由下一步从 backend/go.mod 推导（与 ci.yml 同一份单一来源）
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum

      - name: Verify Go toolchain pin
        run: bash "$GITHUB_WORKSPACE/.github/scripts/check-go-toolchain.sh"

      - name: Install golang-migrate
        # 与 docker-compose 的 migrate 服务保持同一版本
        run: |
          go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.17.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Ensure psql
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Migration upgrade path
        run: bash scripts/migration_upgrade_test.sh
