name: CI

on:
  push:
  pull_request:

env:
  # 钉住最新 1.25 补丁版，确保标准库漏洞（govulncheck）及时修复。
  # setup-go 的 '1.25.x' 版本解析可能命中 runner 缓存的旧补丁版，
  # GOTOOLCHAIN 让所有 go 命令强制切换到该精确版本（自动从 GOPROXY 下载）。
  # 新补丁发布时（如 go1.25.14）在此更新即可。
  GOTOOLCHAIN: go1.25.13+auto

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 用 1.25.x 而非 go-version-file：后者会钉死 go.mod 里的精确版本，
          # 导致标准库漏洞（如 GO-2026-5856，go1.25.12 修复）无法随补丁版自动修复
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          working-directory: backend

  vuln:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 用 1.25.x 而非 go-version-file：后者会钉死 go.mod 里的精确版本，
          # 导致标准库漏洞（如 GO-2026-5856，go1.25.12 修复）无法随补丁版自动修复
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: go version

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 用 1.25.x 而非 go-version-file：后者会钉死 go.mod 里的精确版本，
          # 导致标准库漏洞（如 GO-2026-5856，go1.25.12 修复）无法随补丁版自动修复
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum

      # ubuntu-latest 自带 Docker，testcontainers 直接可用
      - name: Integration tests (repo layer)
        run: go test -tags=integration ./internal/repo/pg/...

      - name: Integration tests (app startup/health/shutdown)
        run: go test -tags=integration -count=1 ./internal/app/...

      - name: E2E tests (HTTP + PG + Redis)
        run: go test -tags=integration -count=1 ./e2e/...

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 用 1.25.x 而非 go-version-file：后者会钉死 go.mod 里的精确版本，
          # 导致标准库漏洞（如 GO-2026-5856，go1.25.12 修复）无法随补丁版自动修复
          go-version: '1.25.x'
          cache-dependency-path: backend/go.sum

      - name: Verify go.mod/go.sum tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest

      - name: Verify sqlc generated files
        run: |
          sqlc generate
          git diff --exit-code -- internal/repo/sqlc/gen

      - name: Verify OpenAPI contract
        run: go test -run 'Test(OpenAPI|LoadDocument)' ./internal/openapi/... ./internal/http/...

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Coverage threshold (>= 50%)
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t < 50.0) { printf "::error::Coverage %.1f%% is below 50%% threshold\n", t; exit 1 } }'

      - name: Build
        run: go build -o /tmp/app-api .
