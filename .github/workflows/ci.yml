name: CI

on:
  push:
  pull_request:

# Go 工具链版本只声明一次：backend/go.mod 的 `toolchain` 行。
#
# 安全基线：工具链必须落在 1.26 线——2026-11 起一批 net/http、net/textproto、
# crypto/tls、crypto/x509 漏洞只在 go1.26.9+ 修复，1.25 线（含 go1.25.14）已无补丁；
# golang.org/x/net ≥ v0.60.0 的 go.mod 也要求 go >= 1.26.0。
#
# 这里刻意不再写 workflow 级 `GOTOOLCHAIN`。原因：setup-go v6+ 会在 Setup Go 步骤里
# 用 GITHUB_ENV 把它覆写成 `local`，同名变量里 GITHUB_ENV 的写入优先于 workflow 级 env，
# 所以那份声明对后续步骤并不生效（实测连 ${{ env.GOTOOLCHAIN }} 都会变成 local）。
# 真正生效的是每个 job 的 Verify Go toolchain 步骤：从 backend/go.mod 的 toolchain 行
# 推导钉扎、写回 GITHUB_ENV，并校验实际 go 版本不低于它（.github/scripts/check-go-toolchain.sh）。
#
# 保留一份「看起来生效、实际会被覆盖」的同名 env 只会制造两处声明漂移：
# 改了 ci.yml 不改 go.mod 不会生效，改了 go.mod 不改 ci.yml 又会让注释过期。
# 因此升级工具链时只改 backend/go.mod 的 toolchain 行；脚本会在版本不可达、
# 实际版本低于钉扎，或有人重新在 ci.yml 里声明 GOTOOLCHAIN 时明确失败。

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # 用 1.26.x 而非 go-version-file：后者会钉死 go.mod 里的精确版本，
          # 无法随补丁版自动修复标准库漏洞；精确钉扎由下一步从 backend/go.mod 的
          # toolchain 行推导并写回 GITHUB_ENV（见 .github/scripts/check-go-toolchain.sh）
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum

      - name: Verify Go toolchain
        # setup-go v6+ 会把 GOTOOLCHAIN 覆写成 local（只跑 runner 装的那份），且实测
        # 连 ${{ env.GOTOOLCHAIN }} 都会取到 local；这一步从 backend/go.mod 的
        # toolchain 行推导钉扎、写回 GITHUB_ENV（后续步骤以它为准），并确认实际
        # go 版本不低于它——版本不可达或偏低时直接失败
        run: bash "$GITHUB_WORKSPACE/.github/scripts/check-go-toolchain.sh"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # 必须 ≥ v2.13（本仓库用 v2.15.0，随 go1.26.11 构建）：
          # 用 go1.25 构建的版本遇到 go.mod 声明 1.26 会直接报
          # "can't load config: the Go language version (go1.25) used to build
          # golangci-lint is lower than the targeted Go version"
          # action v9 要求 golangci-lint ≥ v2.1.0，且运行时已换到 node24
          version: v2.15.0
          working-directory: backend

  vuln:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # 用 1.26.x 而非 go-version-file：后者会钉死 go.mod 里的精确版本，
          # 无法随补丁版自动修复标准库漏洞；精确钉扎由下一步从 backend/go.mod 的
          # toolchain 行推导并写回 GITHUB_ENV（见 .github/scripts/check-go-toolchain.sh）
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum

      - name: Verify Go toolchain
        # setup-go v6+ 会把 GOTOOLCHAIN 覆写成 local（只跑 runner 装的那份），且实测
        # 连 ${{ env.GOTOOLCHAIN }} 都会取到 local；这一步从 backend/go.mod 的
        # toolchain 行推导钉扎、写回 GITHUB_ENV（后续步骤以它为准），并确认实际
        # go 版本不低于它——版本不可达或偏低时直接失败
        run: bash "$GITHUB_WORKSPACE/.github/scripts/check-go-toolchain.sh"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        # 失败时把 Vulnerability #N / Found in / Fixed in 关键行写进 annotation
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-and-annotate.sh" govulncheck govulncheck ./...

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # 用 1.26.x 而非 go-version-file：后者会钉死 go.mod 里的精确版本，
          # 无法随补丁版自动修复标准库漏洞；精确钉扎由下一步从 backend/go.mod 的
          # toolchain 行推导并写回 GITHUB_ENV（见 .github/scripts/check-go-toolchain.sh）
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum

      - name: Verify Go toolchain
        # setup-go v6+ 会把 GOTOOLCHAIN 覆写成 local（只跑 runner 装的那份），且实测
        # 连 ${{ env.GOTOOLCHAIN }} 都会取到 local；这一步从 backend/go.mod 的
        # toolchain 行推导钉扎、写回 GITHUB_ENV（后续步骤以它为准），并确认实际
        # go 版本不低于它——版本不可达或偏低时直接失败
        run: bash "$GITHUB_WORKSPACE/.github/scripts/check-go-toolchain.sh"

      # ubuntu-latest 自带 Docker，testcontainers 直接可用
      # 各步统一走 run-and-annotate.sh：保留真实退出码 + 失败原因写进 annotation
      - name: Integration tests (repo layer)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-and-annotate.sh" pg-integration go test -tags=integration -count=1 ./internal/repo/pg/...

      - name: Integration tests (mysql repo layer)
        # 与 PG 侧同源的关键行为：OAuth JOIN、UTC 时间戳、CHECK 约束
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-and-annotate.sh" mysql-integration go test -tags=integration -count=1 ./internal/repo/mysql/...

      - name: Integration tests (app startup/health/shutdown)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-and-annotate.sh" app-integration go test -tags=integration -count=1 ./internal/app/...

      - name: E2E tests (HTTP + PG + Redis)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-and-annotate.sh" e2e go test -tags=integration -count=1 ./e2e/...

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # 用 1.26.x 而非 go-version-file：后者会钉死 go.mod 里的精确版本，
          # 无法随补丁版自动修复标准库漏洞；精确钉扎由下一步从 backend/go.mod 的
          # toolchain 行推导并写回 GITHUB_ENV（见 .github/scripts/check-go-toolchain.sh）
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum

      - name: Verify Go toolchain
        # setup-go v6+ 会把 GOTOOLCHAIN 覆写成 local（只跑 runner 装的那份），且实测
        # 连 ${{ env.GOTOOLCHAIN }} 都会取到 local；这一步从 backend/go.mod 的
        # toolchain 行推导钉扎、写回 GITHUB_ENV（后续步骤以它为准），并确认实际
        # go 版本不低于它——版本不可达或偏低时直接失败
        run: bash "$GITHUB_WORKSPACE/.github/scripts/check-go-toolchain.sh"

      - name: Verify go.mod/go.sum tidy
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-and-annotate.sh" mod-tidy bash -c 'go mod tidy && git diff --exit-code -- go.mod go.sum'

      - name: Install sqlc
        # 钉住与已提交生成物一致的版本：@latest 会拉到新版（如 v1.31.x），
        # 生成结果与 gen/ 产生 diff 导致校验失败
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0

      - name: Verify sqlc generated files
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-and-annotate.sh" sqlc-drift bash -c 'sqlc generate && git diff --exit-code -- internal/repo/sqlc/gen'

      - name: Verify OpenAPI contract
        run: go test -run 'Test(OpenAPI|LoadDocument)' ./internal/openapi/... ./internal/http/...

      - name: Test
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-and-annotate.sh" unit-tests go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Coverage threshold (>= 55%)
        # 门槛依据（2026-11-27）：按本 job 的命令（-race -covermode=atomic ./...）实测
        # 总覆盖率为 62.4%，且这是保守下界——本机没有 PG/Redis，repo 集成与 e2e 会 skip，
        # CI 上这些用例跑起来只会更高。取 55% 留约 7 个点余量：正常重构（挪代码、
        # 新增少量分支）不会立刻变红，同时不再像 50% 那样只防「覆盖率归零」。
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t < 55.0) { printf "::error::Coverage %.1f%% is below 55%% threshold\n", t; exit 1 } }'

      - name: Build
        run: go build -o /tmp/app-api .

  # 验证「一键起栈」入口本身可用：Dockerfile、.dockerignore、基础镜像、静态二进制
  # 与 config/ 的拷贝路径。其余 job 都不构建镜像，Dockerfile 坏掉只能等部署时才发现。
  # 与其它 job 并行（不设 needs），不进入关键路径；镜像层与 Go 模块走 GHA 缓存。
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: studiory-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test binary startup
        # 不依赖 DB/Redis：镜像内默认 APP_ENV=production，应在配置校验阶段
        # 打印「配置错误」并以 1 退出。能同时验证二进制可执行、config/ 已进镜像、
        # ENTRYPOINT 正确；若哪天配置校验被绕过而进程卡住，这一步会超时报错。
        run: |
          set +e
          out=$(timeout 30 docker run --rm studiory-api:ci 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -ne 1 ] || ! printf '%s' "$out" | grep -q "配置错误"; then
            echo "::error::image smoke test failed (exit=$code)"
            exit 1
          fi
