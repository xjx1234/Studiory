name: CI

on:
  push:
  pull_request:

env:
  # 工具链必须落在 1.26 线：2026-11 起一批 net/http、net/textproto、crypto/tls、
  # crypto/x509 漏洞只在 go1.26.9+ 修复，1.25 线（含 go1.25.14）已无对应补丁；
  # golang.org/x/net ≥ v0.60.0 的 go.mod 也要求 go >= 1.26.0。
  # setup-go 的 '1.26.x' 解析可能命中 runner 缓存的旧补丁版，
  # GOTOOLCHAIN 让所有 go 命令强制使用该精确版本（自动从 GOPROXY 下载）。
  # ⚠ 这里只是「Setup Go 之前」的默认值：setup-go v6+ 起会用 GITHUB_ENV 把
  # GOTOOLCHAIN 覆写成 local，实测连 ${{ env.GOTOOLCHAIN }} 都跟着变成 local。
  # 真正把钉扎守住的是每个 job 里的 Verify Go toolchain 步骤
  # （.github/scripts/check-go-toolchain.sh），它从 backend/go.mod 的 toolchain 行
  # 取版本、写回 $GITHUB_ENV，再校验实际 go 版本不低于它。
  # 新补丁发布时（如 go1.26.12）改 backend/go.mod 的 toolchain 行并同步这里，
  # 否则本地/镜像与 CI 用的补丁版会不一致。
  GOTOOLCHAIN: go1.26.11+auto

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # 用 1.26.x 而非 go-version-file：后者会钉死 go.mod 里的精确版本，
          # 无法随补丁版自动修复标准库漏洞；精确钉扎由 workflow 级 GOTOOLCHAIN 负责
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum

      - name: Verify Go toolchain
        # setup-go v6+ 会把 GOTOOLCHAIN 覆写成 local（只跑 runner 装的那份），且实测
        # 连 ${{ env.GOTOOLCHAIN }} 都会取到 local——钉扎由脚本从 backend/go.mod 的
        # toolchain 行推导、写回 $GITHUB_ENV，并确认实际 go 版本不低于它
        run: bash "$GITHUB_WORKSPACE/.github/scripts/check-go-toolchain.sh"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # 必须 ≥ v2.13（本仓库用 v2.15.0，随 go1.26.11 构建）：
          # 用 go1.25 构建的版本遇到 go.mod 声明 1.26 会直接报
          # "can't load config: the Go language version (go1.25) used to build
          # golangci-lint is lower than the targeted Go version"
          # action v9 要求 golangci-lint ≥ v2.1.0，且运行时已换到 node24
          version: v2.15.0
          working-directory: backend

  vuln:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # 用 1.26.x 而非 go-version-file：后者会钉死 go.mod 里的精确版本，
          # 无法随补丁版自动修复标准库漏洞；精确钉扎由 workflow 级 GOTOOLCHAIN 负责
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum

      - name: Verify Go toolchain
        # setup-go v6+ 会把 GOTOOLCHAIN 覆写成 local（只跑 runner 装的那份），且实测
        # 连 ${{ env.GOTOOLCHAIN }} 都会取到 local——钉扎由脚本从 backend/go.mod 的
        # toolchain 行推导、写回 $GITHUB_ENV，并确认实际 go 版本不低于它
        run: bash "$GITHUB_WORKSPACE/.github/scripts/check-go-toolchain.sh"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        # 失败时把 Vulnerability #N / Found in / Fixed in 关键行写进 annotation
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-and-annotate.sh" govulncheck govulncheck ./...

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # 用 1.26.x 而非 go-version-file：后者会钉死 go.mod 里的精确版本，
          # 无法随补丁版自动修复标准库漏洞；精确钉扎由 workflow 级 GOTOOLCHAIN 负责
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum

      - name: Verify Go toolchain
        # setup-go v6+ 会把 GOTOOLCHAIN 覆写成 local（只跑 runner 装的那份），且实测
        # 连 ${{ env.GOTOOLCHAIN }} 都会取到 local——钉扎由脚本从 backend/go.mod 的
        # toolchain 行推导、写回 $GITHUB_ENV，并确认实际 go 版本不低于它
        run: bash "$GITHUB_WORKSPACE/.github/scripts/check-go-toolchain.sh"

      # ubuntu-latest 自带 Docker，testcontainers 直接可用
      # 各步统一走 run-and-annotate.sh：保留真实退出码 + 失败原因写进 annotation
      - name: Integration tests (repo layer)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-and-annotate.sh" pg-integration go test -tags=integration -count=1 ./internal/repo/pg/...

      - name: Integration tests (mysql repo layer)
        # 与 PG 侧同源的关键行为：OAuth JOIN、UTC 时间戳、CHECK 约束
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-and-annotate.sh" mysql-integration go test -tags=integration -count=1 ./internal/repo/mysql/...

      - name: Integration tests (app startup/health/shutdown)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-and-annotate.sh" app-integration go test -tags=integration -count=1 ./internal/app/...

      - name: E2E tests (HTTP + PG + Redis)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-and-annotate.sh" e2e go test -tags=integration -count=1 ./e2e/...

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          # 用 1.26.x 而非 go-version-file：后者会钉死 go.mod 里的精确版本，
          # 无法随补丁版自动修复标准库漏洞；精确钉扎由 workflow 级 GOTOOLCHAIN 负责
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum

      - name: Verify Go toolchain
        # setup-go v6+ 会把 GOTOOLCHAIN 覆写成 local（只跑 runner 装的那份），且实测
        # 连 ${{ env.GOTOOLCHAIN }} 都会取到 local——钉扎由脚本从 backend/go.mod 的
        # toolchain 行推导、写回 $GITHUB_ENV，并确认实际 go 版本不低于它
        run: bash "$GITHUB_WORKSPACE/.github/scripts/check-go-toolchain.sh"

      - name: Verify go.mod/go.sum tidy
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-and-annotate.sh" mod-tidy bash -c 'go mod tidy && git diff --exit-code -- go.mod go.sum'

      - name: Install sqlc
        # 钉住与已提交生成物一致的版本：@latest 会拉到新版（如 v1.31.x），
        # 生成结果与 gen/ 产生 diff 导致校验失败
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0

      - name: Verify sqlc generated files
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-and-annotate.sh" sqlc-drift bash -c 'sqlc generate && git diff --exit-code -- internal/repo/sqlc/gen'

      - name: Verify OpenAPI contract
        run: go test -run 'Test(OpenAPI|LoadDocument)' ./internal/openapi/... ./internal/http/...

      - name: Test
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-and-annotate.sh" unit-tests go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Coverage threshold (>= 50%)
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t < 50.0) { printf "::error::Coverage %.1f%% is below 50%% threshold\n", t; exit 1 } }'

      - name: Build
        run: go build -o /tmp/app-api .
